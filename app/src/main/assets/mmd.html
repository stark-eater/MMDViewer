<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background-color: #333333; touch-action: none; color: white; font-family: sans-serif; }
        #logArea { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 100; font-size: 14px; pointer-events: none; text-shadow: 1px 1px 2px black; font-weight: bold; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 50; font-size: 16px; text-align: center; }
    </style>
</head>
<body>
<div id="loading">Initializing Engine...<br><small>(Downloading 3D scripts, please wait)</small></div>
<div id="logArea"></div>

<script>
    function logMsg(msg) {
        document.getElementById('logArea').innerHTML += msg + "<br>";
    }
    window.onerror = function(msg, url, line) {
        logMsg("<span style='color:red'>CRASH: " + msg + " (Line " + line + ")</span>");
    };
</script>

<!-- Core Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mmd-parser@1.0.4/build/mmdparser.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/TGALoader.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/MMDLoader.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>

<!-- MMD Animation Helper -->
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/animation/CCDIKSolver.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/animation/MMDPhysics.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/animation/MMDAnimationHelper.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/libs/ammo.wasm.js"></script>

<script>
    let scene, camera, renderer, model, gridHelper, axesHelper, groundMesh;
    let controls, helper;
    let ready = false;
    const clock = new THREE.Clock();

    // Track if any textures fail so we know whether to clear the log
    let hasTextureErrors = false;

    const ammoConfig = {
        locateFile: function(path) {
            return 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/libs/' + path;
        }
    };

    Ammo(ammoConfig).then(function(AmmoLib) {
        window.Ammo = AmmoLib;
        init();
    }).catch(function(e) {
        logMsg("<span style='color:red'>Failed to init Physics: " + e + "</span>");
    });

    function init() {
        // CRITICAL FIX: Intercept every URL and replace Windows backslashes with Android forward slashes!
        THREE.DefaultLoadingManager.setURLModifier(function (url) {
            return url.replace(/\\/g, '/');
        });

        // Catch texture errors and print them permanently
        THREE.DefaultLoadingManager.onError = function ( url ) {
            hasTextureErrors = true;
            let filename = url.split('/').pop();
            logMsg("<span style='color:orange'>Missing Texture: " + decodeURIComponent(filename) + "</span>");
        };

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdddddd);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 40);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding;

        document.body.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 10, 0);
        controls.update();

        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 30, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        axesHelper = new THREE.AxesHelper(50);
        scene.add(axesHelper);
        gridHelper = new THREE.GridHelper(100, 100, 0x000000, 0xaaaaaa);
        scene.add(gridHelper);

        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.ShadowMaterial({ opacity: 0.5 });
        groundMesh = new THREE.Mesh(groundGeo, groundMat);
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        helper = new THREE.MMDAnimationHelper({ afterglow: 2.0 });

        animate();

        document.getElementById('loading').style.display = 'none';
        logMsg("Engine Ready. Waiting for a custom model...");

        window.addEventListener('resize', onWindowResize, false);
    }

    function loadLocalModel(modelUrl) {
        hasTextureErrors = false; // Reset error tracker
        document.getElementById('logArea').innerHTML = ''; // Clear old logs

        document.getElementById('loading').style.display = 'block';
        document.getElementById('loading').innerHTML = "Parsing Local Model...";

        if (model) {
            scene.remove(model);
            helper.remove(model);
            model = null;
        }

        const loader = new THREE.MMDLoader();
        loader.setCrossOrigin('anonymous');

        loader.load(
            modelUrl,
            function (mesh) {
                model = mesh;
                model.castShadow = true;
                model.receiveShadow = true;
                scene.add(model);
                helper.add(model, { physics: true });

                ready = true;
                document.getElementById('loading').style.display = 'none';

                if (!hasTextureErrors) {
                    logMsg("<span style='color:lime'>Model and Textures loaded successfully!</span>");
                    setTimeout(() => document.getElementById('logArea').innerHTML = '', 3000);
                } else {
                    logMsg("<br><span style='color:yellow'>^ Some textures failed. Check the errors above!</span>");
                }
            },
            function (xhr) {
                if (xhr.lengthComputable) {
                    let percentComplete = Math.round((xhr.loaded / xhr.total) * 100);
                    document.getElementById('loading').innerHTML = "Loading Model: " + percentComplete + "%";
                }
            },
            function (e) {
                logMsg("<span style='color:red'>Failed to load model: " + e + "</span>");
                document.getElementById('loading').style.display = 'none';
            }
        );
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        if (ready) helper.update(clock.getDelta());
        controls.update();
        renderer.render(scene, camera);
    }

    function setSelfShadow(enabled) { if (model) model.receiveShadow = enabled; }
    function setGroundShadow(enabled) { if (groundMesh) groundMesh.visible = enabled; }
    function setAxesAndPlanes(enabled) {
        if (axesHelper) axesHelper.visible = enabled;
        if (gridHelper) gridHelper.visible = enabled;
    }
    function setModelTransform(x, y, z, rx, ry, rz) {
        if (!model) return;
        model.position.set(x, y, z);
        model.rotation.set(THREE.MathUtils.degToRad(rx), THREE.MathUtils.degToRad(ry), THREE.MathUtils.degToRad(rz));
    }
    function setCameraTransform(x, y, z, rx, ry, rz) {
        camera.position.set(x, y, z);
        camera.rotation.set(THREE.MathUtils.degToRad(rx), THREE.MathUtils.degToRad(ry), THREE.MathUtils.degToRad(rz));
        camera.updateProjectionMatrix();
    }
</script>
</body>
</html>
